<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="ach-t">
  <title id="ach-t">Achievements and Recognition</title>
  <defs>
    <linearGradient id="ach-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ach-glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#701A3D" stop-opacity=".4"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
    <clipPath id="ach-clip"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>
  <style>
    .ach-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ach-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>
  <g clip-path="url(#ach-clip)">
    <rect width="1200" height="320" fill="url(#ach-bg)"/>
    <rect width="1200" height="320" fill="url(#ach-glow)"/>

    <!-- 4 Recognition Metric Cards -->
    <!-- Card 1: LeetCode -->
    <g transform="translate(40, 20)">
      <rect width="260" height="280" rx="12" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="24" y="40" class="ach-mono" font-size="11" fill="#C77B9B" letter-spacing="2">01 // LEETCODE</text>
      <text x="24" y="100" class="ach-serif" font-size="52" font-weight="700" fill="#F8F0F3">20+</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#E5B5C7">ALGORITHMS SOLVED</text>
      <line x1="24" y1="155" x2="236" y2="155" stroke="#701A3D" stroke-width="1"/>
      <text x="24" y="185" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Easy: 4 / 974</text>
      <text x="24" y="210" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Medium: 12 / 2136</text>
      <text x="24" y="235" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Hard: 4 / 986</text>
      <text x="24" y="260" class="ach-mono" font-size="9.5" fill="#C77B9B">PROFILE: @sarthi278</text>
    </g>

    <!-- Card 2: HackerRank -->
    <g transform="translate(330, 20)">
      <rect width="260" height="280" rx="12" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="24" y="40" class="ach-mono" font-size="11" fill="#C77B9B" letter-spacing="2">02 // HACKERRANK</text>
      <text x="24" y="100" class="ach-serif" font-size="52" font-weight="700" fill="#F8F0F3">5&#9733;</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#E5B5C7">PROBLEM SOLVING</text>
      <line x1="24" y1="155" x2="236" y2="155" stroke="#701A3D" stroke-width="1"/>
      <text x="24" y="185" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Python &amp; Data Structures</text>
      <text x="24" y="210" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Algorithmic Challenges</text>
      <text x="24" y="235" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Core Logic Mastery</text>
      <text x="24" y="260" class="ach-mono" font-size="9.5" fill="#C77B9B">PROFILE: @yadavanubhav848</text>
    </g>

    <!-- Card 3: Systems & Production -->
    <g transform="translate(620, 20)">
      <rect width="260" height="280" rx="12" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="24" y="40" class="ach-mono" font-size="11" fill="#C77B9B" letter-spacing="2">03 // ARCHITECTURE</text>
      <text x="24" y="100" class="ach-serif" font-size="52" font-weight="700" fill="#F8F0F3">99.8%</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#E5B5C7">UPTIME &amp; RELIABILITY</text>
      <line x1="24" y1="155" x2="236" y2="155" stroke="#701A3D" stroke-width="1"/>
      <text x="24" y="185" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Next.js 14 SSR Architecture</text>
      <text x="24" y="210" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Resilient REST/GraphQL APIs</text>
      <text x="24" y="235" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; In-Memory Redis Caching</text>
      <text x="24" y="260" class="ach-mono" font-size="9.5" fill="#C77B9B">CONTAINERIZED WITH DOCKER</text>
    </g>

    <!-- Card 4: Open-Source Footprint -->
    <g transform="translate(910, 20)">
      <rect width="250" height="280" rx="12" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="24" y="40" class="ach-mono" font-size="11" fill="#C77B9B" letter-spacing="2">04 // OPEN SOURCE</text>
      <text x="24" y="100" class="ach-serif" font-size="52" font-weight="700" fill="#F8F0F3">35+</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#E5B5C7">ACTIVE REPOSITORIES</text>
      <line x1="24" y1="155" x2="226" y2="155" stroke="#701A3D" stroke-width="1"/>
      <text x="24" y="185" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Full-Stack Web Projects</text>
      <text x="24" y="210" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Python &amp; Data Engineering</text>
      <text x="24" y="235" class="ach-mono" font-size="11" fill="#F8F0F3">&bull; Daily Commit Streak</text>
      <text x="24" y="260" class="ach-mono" font-size="9.5" fill="#C77B9B">GITHUB: @sarthi278</text>
    </g>
