<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="ach-t">
  <title id="ach-t">Achievements and Recognition</title>
  <defs>
    <radialGradient id="ach-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#3A0F25"/>
      <stop offset="60%" stop-color="#200915"/>
      <stop offset="100%" stop-color="#12040B"/>
    </radialGradient>
    <radialGradient id="ach-glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#FF1775" stop-opacity=".65"/><stop offset="100%" stop-color="#FF1775" stop-opacity="0"/></radialGradient>
    <linearGradient id="ach-border" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF66A3"/><stop offset="50%" stop-color="#FF1775"/><stop offset="100%" stop-color="#FF66A3"/></linearGradient>
    <filter id="neon-glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ach-clip"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .ach-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ach-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>
  <g clip-path="url(#ach-clip)">
    <rect width="1200" height="320" fill="url(#ach-bg)"/>
    <rect width="1200" height="320" fill="url(#ach-glow)"/>

    <!-- Glowing Outer Frame Border -->
    <rect x="3" y="3" width="1194" height="314" rx="14" fill="none" stroke="url(#ach-border)" stroke-width="2" filter="url(#neon-glow3)"/>

    <!-- 4 Recognition Metric Cards with High Contrast & Neon Glow -->
    <!-- Card 1: LeetCode -->
    <g transform="translate(40, 20)">
      <rect width="260" height="280" rx="12" fill="#1C0814" stroke="#FF1775" stroke-width="1.6"/>
      <text x="24" y="40" class="ach-mono" font-size="11" font-weight="700" fill="#FFA8CC" letter-spacing="2">01 // LEETCODE</text>
      <text x="24" y="100" class="ach-serif" font-size="54" font-weight="700" fill="#FFFFFF" filter="url(#neon-glow3)">20+</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#FF85B2">ALGORITHMS SOLVED</text>
      <line x1="24" y1="155" x2="236" y2="155" stroke="#FF1775" stroke-width="1.2"/>
      <text x="24" y="185" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Easy: 4 / 974</text>
      <text x="24" y="210" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Medium: 12 / 2136</text>
      <text x="24" y="235" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Hard: 4 / 986</text>
      <text x="24" y="260" class="ach-mono" font-size="10" font-weight="700" fill="#FF66A3">PROFILE: @sarthi278</text>
    </g>

    <!-- Card 2: HackerRank -->
    <g transform="translate(330, 20)">
      <rect width="260" height="280" rx="12" fill="#1C0814" stroke="#FF1775" stroke-width="1.6"/>
      <text x="24" y="40" class="ach-mono" font-size="11" font-weight="700" fill="#FFA8CC" letter-spacing="2">02 // HACKERRANK</text>
      <text x="24" y="100" class="ach-serif" font-size="54" font-weight="700" fill="#FFFFFF" filter="url(#neon-glow3)">5&#9733;</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#FF85B2">PROBLEM SOLVING</text>
      <line x1="24" y1="155" x2="236" y2="155" stroke="#FF1775" stroke-width="1.2"/>
      <text x="24" y="185" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Python &amp; Data Structures</text>
      <text x="24" y="210" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Algorithmic Challenges</text>
      <text x="24" y="235" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Core Logic Mastery</text>
      <text x="24" y="260" class="ach-mono" font-size="10" font-weight="700" fill="#FF66A3">PROFILE: @yadavanubhav848</text>
    </g>

    <!-- Card 3: Architecture -->
    <g transform="translate(620, 20)">
      <rect width="260" height="280" rx="12" fill="#1C0814" stroke="#FF1775" stroke-width="1.6"/>
      <text x="24" y="40" class="ach-mono" font-size="11" font-weight="700" fill="#FFA8CC" letter-spacing="2">03 // ARCHITECTURE</text>
      <text x="24" y="100" class="ach-serif" font-size="54" font-weight="700" fill="#FFFFFF" filter="url(#neon-glow3)">99.8%</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#FF85B2">UPTIME &amp; RELIABILITY</text>
      <line x1="24" y1="155" x2="236" y2="155" stroke="#FF1775" stroke-width="1.2"/>
      <text x="24" y="185" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Next.js 14 SSR &amp; Edge</text>
      <text x="24" y="210" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Resilient REST/GraphQL APIs</text>
      <text x="24" y="235" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; In-Memory Redis Caching</text>
      <text x="24" y="260" class="ach-mono" font-size="10" font-weight="700" fill="#FF66A3">DOCKER CONTAINERIZED</text>
    </g>

    <!-- Card 4: Open Source -->
    <g transform="translate(910, 20)">
      <rect width="250" height="280" rx="12" fill="#1C0814" stroke="#FF1775" stroke-width="1.6"/>
      <text x="24" y="40" class="ach-mono" font-size="11" font-weight="700" fill="#FFA8CC" letter-spacing="2">04 // OPEN SOURCE</text>
      <text x="24" y="100" class="ach-serif" font-size="54" font-weight="700" fill="#FFFFFF" filter="url(#neon-glow3)">35+</text>
      <text x="24" y="130" class="ach-mono" font-size="12" font-weight="700" fill="#FF85B2">ACTIVE REPOSITORIES</text>
      <line x1="24" y1="155" x2="226" y2="155" stroke="#FF1775" stroke-width="1.2"/>
      <text x="24" y="185" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Full-Stack Web Projects</text>
      <text x="24" y="210" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Python &amp; Data Engineering</text>
      <text x="24" y="235" class="ach-mono" font-size="11.5" font-weight="600" fill="#FFFFFF">&#8226; Daily Commit Streak</text>
      <text x="24" y="260" class="ach-mono" font-size="10" font-weight="700" fill="#FF66A3">GITHUB: @sarthi278</text>
    </g>

    <!-- Animated Corner Brackets -->
    <path d="M 18 45 L 18 18 L 45 18" fill="none" stroke="#FFA8CC" stroke-width="2.5"/>
    <circle cx="18" cy="18" r="4" fill="#FFFFFF" filter="url(#neon-glow3)"/>

    <path d="M 1182 45 L 1182 18 L 1155 18" fill="none" stroke="#FFA8CC" stroke-width="2.5"/>
    <circle cx="1182" cy="18" r="4" fill="#FFFFFF" filter="url(#neon-glow3)"/>

    <path d="M 18 275 L 18 302 L 45 302" fill="none" stroke="#FFA8CC" stroke-width="2.5"/>
    <circle cx="18" cy="302" r="4" fill="#FFFFFF" filter="url(#neon-glow3)"/>

    <path d="M 1182 275 L 1182 302 L 1155 302" fill="none" stroke="#FFA8CC" stroke-width="2.5"/>
    <circle cx="1182" cy="302" r="4" fill="#FFFFFF" filter="url(#neon-glow3)"/>
  </g>
</svg>
