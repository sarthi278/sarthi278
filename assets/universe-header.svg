<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- ══ GRADIENTS ══ -->
    <radialGradient id="cosmos" cx="50%" cy="50%" r="80%">
      <stop offset="0%"   stop-color="#0d0221"/>
      <stop offset="40%"  stop-color="#06001a"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="20%" cy="40%" r="45%">
      <stop offset="0%"   stop-color="#6B21A8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="78%" cy="60%" r="45%">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="85%" r="40%">
      <stop offset="0%"   stop-color="#BE185D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6B21A8" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#8B5CF6"/>
      <stop offset="70%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white"   stop-opacity="0"/>
      <stop offset="100%" stop-color="white"   stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="shootGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C8D6FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C8D6FF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#2d0d52"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </radialGradient>
    <!-- ══ FILTERS ══ -->
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nameGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="900" height="320" fill="url(#cosmos)"/>
  <rect width="900" height="320" fill="url(#nebula1)"/>
  <rect width="900" height="320" fill="url(#nebula2)"/>
  <rect width="900" height="320" fill="url(#nebula3)"/>

  <!-- ══ STATIC STAR FIELD ══ -->
  <g opacity="0.6">
    <!-- Row 1 -->
    <circle cx="12"  cy="18"  r="0.6" fill="white"/>
    <circle cx="45"  cy="7"   r="0.5" fill="white"/>
    <circle cx="78"  cy="30"  r="0.7" fill="#E0E8FF"/>
    <circle cx="130" cy="12"  r="0.5" fill="white"/>
    <circle cx="167" cy="45"  r="0.6" fill="white"/>
    <circle cx="210" cy="8"   r="0.5" fill="#E0E8FF"/>
    <circle cx="250" cy="22"  r="0.7" fill="white"/>
    <circle cx="310" cy="5"   r="0.5" fill="white"/>
    <circle cx="355" cy="40"  r="0.6" fill="#E0E8FF"/>
    <circle cx="402" cy="15"  r="0.5" fill="white"/>
    <circle cx="455" cy="28"  r="0.7" fill="white"/>
    <circle cx="510" cy="6"   r="0.5" fill="#E0E8FF"/>
    <circle cx="560" cy="38"  r="0.6" fill="white"/>
    <circle cx="612" cy="11"  r="0.5" fill="white"/>
    <circle cx="665" cy="42"  r="0.7" fill="#E0E8FF"/>
    <circle cx="718" cy="9"   r="0.5" fill="white"/>
    <circle cx="772" cy="33"  r="0.6" fill="white"/>
    <circle cx="820" cy="14"  r="0.5" fill="#E0E8FF"/>
    <circle cx="870" cy="27"  r="0.7" fill="white"/>
    <circle cx="895" cy="8"   r="0.5" fill="white"/>
    <!-- Row 2 -->
    <circle cx="25"  cy="90"  r="0.5" fill="white"/>
    <circle cx="68"  cy="75"  r="0.6" fill="#E0E8FF"/>
    <circle cx="115" cy="98"  r="0.5" fill="white"/>
    <circle cx="155" cy="80"  r="0.7" fill="white"/>
    <circle cx="192" cy="105" r="0.5" fill="#E0E8FF"/>
    <circle cx="235" cy="72"  r="0.6" fill="white"/>
    <circle cx="288" cy="88"  r="0.5" fill="white"/>
    <circle cx="332" cy="110" r="0.7" fill="#E0E8FF"/>
    <circle cx="378" cy="78"  r="0.5" fill="white"/>
    <circle cx="420" cy="95"  r="0.6" fill="white"/>
    <circle cx="468" cy="65"  r="0.5" fill="#E0E8FF"/>
    <circle cx="525" cy="100" r="0.7" fill="white"/>
    <circle cx="575" cy="82"  r="0.5" fill="white"/>
    <circle cx="628" cy="68"  r="0.6" fill="#E0E8FF"/>
    <circle cx="680" cy="92"  r="0.5" fill="white"/>
    <circle cx="735" cy="77"  r="0.7" fill="white"/>
    <circle cx="788" cy="102" r="0.5" fill="#E0E8FF"/>
    <circle cx="840" cy="85"  r="0.6" fill="white"/>
    <circle cx="888" cy="70"  r="0.5" fill="white"/>
    <!-- Row 3 -->
    <circle cx="30"  cy="150" r="0.6" fill="white"/>
    <circle cx="80"  cy="135" r="0.5" fill="#E0E8FF"/>
    <circle cx="140" cy="162" r="0.7" fill="white"/>
    <circle cx="195" cy="145" r="0.5" fill="white"/>
    <circle cx="245" cy="168" r="0.6" fill="#E0E8FF"/>
    <circle cx="295" cy="130" r="0.5" fill="white"/>
    <circle cx="348" cy="155" r="0.7" fill="white"/>
    <circle cx="395" cy="140" r="0.5" fill="#E0E8FF"/>
    <circle cx="445" cy="170" r="0.6" fill="white"/>
    <circle cx="495" cy="132" r="0.5" fill="white"/>
    <circle cx="548" cy="158" r="0.7" fill="#E0E8FF"/>
    <circle cx="598" cy="143" r="0.5" fill="white"/>
    <circle cx="648" cy="165" r="0.6" fill="white"/>
    <circle cx="700" cy="138" r="0.5" fill="#E0E8FF"/>
    <circle cx="752" cy="155" r="0.7" fill="white"/>
    <circle cx="805" cy="130" r="0.5" fill="white"/>
    <circle cx="855" cy="160" r="0.6" fill="#E0E8FF"/>
    <circle cx="893" cy="145" r="0.5" fill="white"/>
    <!-- Row 4 -->
    <circle cx="20"  cy="220" r="0.5" fill="white"/>
    <circle cx="65"  cy="205" r="0.7" fill="#E0E8FF"/>
    <circle cx="118" cy="232" r="0.6" fill="white"/>
    <circle cx="168" cy="215" r="0.5" fill="white"/>
    <circle cx="225" cy="240" r="0.7" fill="#E0E8FF"/>
    <circle cx="275" cy="208" r="0.5" fill="white"/>
    <circle cx="325" cy="228" r="0.6" fill="white"/>
    <circle cx="375" cy="212" r="0.5" fill="#E0E8FF"/>
    <circle cx="428" cy="235" r="0.7" fill="white"/>
    <circle cx="478" cy="218" r="0.5" fill="white"/>
    <circle cx="528" cy="242" r="0.6" fill="#E0E8FF"/>
    <circle cx="582" cy="210" r="0.5" fill="white"/>
    <circle cx="635" cy="230" r="0.7" fill="white"/>
    <circle cx="688" cy="215" r="0.5" fill="#E0E8FF"/>
    <circle cx="740" cy="238" r="0.6" fill="white"/>
    <circle cx="792" cy="205" r="0.5" fill="white"/>
    <circle cx="845" cy="225" r="0.7" fill="#E0E8FF"/>
    <circle cx="890" cy="212" r="0.5" fill="white"/>
    <!-- Row 5 -->
    <circle cx="38"  cy="285" r="0.6" fill="white"/>
    <circle cx="92"  cy="270" r="0.5" fill="#E0E8FF"/>
    <circle cx="148" cy="295" r="0.7" fill="white"/>
    <circle cx="202" cy="278" r="0.5" fill="white"/>
    <circle cx="258" cy="308" r="0.6" fill="#E0E8FF"/>
    <circle cx="312" cy="275" r="0.5" fill="white"/>
    <circle cx="365" cy="292" r="0.7" fill="white"/>
    <circle cx="418" cy="280" r="0.5" fill="#E0E8FF"/>
    <circle cx="472" cy="305" r="0.6" fill="white"/>
    <circle cx="525" cy="272" r="0.5" fill="white"/>
    <circle cx="578" cy="298" r="0.7" fill="#E0E8FF"/>
    <circle cx="632" cy="285" r="0.5" fill="white"/>
    <circle cx="685" cy="310" r="0.6" fill="white"/>
    <circle cx="738" cy="275" r="0.5" fill="#E0E8FF"/>
    <circle cx="790" cy="295" r="0.7" fill="white"/>
    <circle cx="842" cy="280" r="0.5" fill="white"/>
    <circle cx="878" cy="302" r="0.6" fill="#E0E8FF"/>
  </g>

  <!-- ══ TWINKLING STARS ══ -->
  <g filter="url(#starGlow)">
    <circle cx="55"  cy="55"  r="1.5" fill="white">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="25"  r="1.8" fill="#C8D6FF">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="58"  r="1.6" fill="white">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="30"  r="2"   fill="#FFE8C8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="102" cy="175" r="1.7" fill="#C8D6FF">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="488" cy="185" r="1.6" fill="white">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="742" cy="175" r="1.8" fill="#FFD6F0">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="260" r="1.5" fill="white">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="665" cy="255" r="2"   fill="#C8D6FF">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="265" r="1.7" fill="white">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ══ SPARKLE STARS (cross shape) ══ -->
  <g filter="url(#starGlow)">
    <g>
      <circle cx="90" cy="40" r="2.5" fill="white">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <line x1="90" y1="33" x2="90" y2="47" stroke="white" stroke-width="0.8">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="83" y1="40" x2="97" y2="40" stroke="white" stroke-width="0.8">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/>
      </line>
    </g>
    <g>
      <circle cx="430" cy="290" r="2.2" fill="#D0C8FF">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/>
      </circle>
      <line x1="430" y1="283" x2="430" y2="297" stroke="#D0C8FF" stroke-width="0.8">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="423" y1="290" x2="437" y2="290" stroke="#D0C8FF" stroke-width="0.8">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ══ SHOOTING STARS (path-based, single defs block) ══ -->
  <!-- Shooting star 1 -->
  <rect x="-120" y="55" width="120" height="1.5" fill="url(#shootGrad)" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" dur="6s" keyTimes="0;0.3;0.45;0.55;0.65" repeatCount="indefinite" begin="0s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;900,180" dur="6s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <!-- Shooting star 2 -->
  <rect x="-80" y="30" width="80" height="1.2" fill="url(#shootGrad)" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.8;0.8;0" dur="8s" keyTimes="0;0.25;0.35;0.45;0.55;0.65" repeatCount="indefinite" begin="2.5s"/>
    <animateTransform attributeName="transform" type="translate" values="200,-10;900,160" dur="8s" repeatCount="indefinite" begin="2.5s"/>
  </rect>
  <!-- Shooting star 3 -->
  <rect x="-90" y="20" width="90" height="1" fill="url(#shootGrad2)" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.7;0.7;0" dur="10s" keyTimes="0;0.3;0.42;0.5;0.58;0.68" repeatCount="indefinite" begin="5s"/>
    <animateTransform attributeName="transform" type="translate" values="100,-5;850,220" dur="10s" repeatCount="indefinite" begin="5s"/>
  </rect>

  <!-- ══ PLANET (top-right) ══ -->
  <g transform="translate(818,82)">
    <!-- Planet body -->
    <circle cx="0" cy="0" r="22" fill="url(#planetGrad)" stroke="#6B21A8" stroke-width="1.5"/>
    <!-- Surface detail -->
    <circle cx="-5" cy="-6" r="8" fill="#2d0d52" opacity="0.5"/>
    <circle cx="8"  cy="8"  r="5" fill="#1a0533" opacity="0.4"/>
    <!-- Ring -->
    <ellipse cx="0" cy="0" rx="36" ry="10" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Orbiting moon -->
    <circle cx="40" cy="0" r="5" fill="#4C1D95">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Glow pulse -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ══ ROCKET (left side, floating) ══ -->
  <g filter="url(#flameGlow)">
    <!-- Rocket float animation wrapper -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-10; 0,0" dur="4s" repeatCount="indefinite"/>
      <!-- Rocket body -->
      <ellipse cx="55" cy="248" rx="7" ry="14" fill="#6B21A8"/>
      <!-- Nose cone -->
      <polygon points="55,230 47,246 63,246" fill="#A78BFA"/>
      <!-- Window -->
      <circle cx="55" cy="249" r="3.5" fill="#1D4ED8" opacity="0.9"/>
      <circle cx="55" cy="249" r="2"   fill="#60A5FA" opacity="0.6"/>
      <!-- Left fin -->
      <polygon points="48,258 43,270 52,264" fill="#7C3AED"/>
      <!-- Right fin -->
      <polygon points="62,258 67,270 58,264" fill="#7C3AED"/>
      <!-- Main flame -->
      <ellipse cx="55" cy="268" rx="4.5" ry="7" fill="#F97316" opacity="0.95">
        <animate attributeName="ry"      values="7;12;7"       dur="0.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.95;0.5;0.95" dur="0.25s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Inner flame -->
      <ellipse cx="55" cy="269" rx="2.5" ry="5" fill="#FCD34D">
        <animate attributeName="ry" values="5;8;5" dur="0.25s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- ══ MAIN TEXT ══ -->
  <!-- Greeting -->
  <text x="450" y="98" text-anchor="middle"
    font-family="Courier New, monospace" font-size="13"
    fill="#A78BFA" letter-spacing="7" filter="url(#glow)" opacity="0">
    H E L L O &amp; &amp; nbsp ; U N I V E R S E
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="0.3s"/>
  </text>

  <!-- Greeting (clean, no entity tricks) -->
  <text x="450" y="98" text-anchor="middle"
    font-family="Courier New, monospace" font-size="13"
    fill="#A78BFA" letter-spacing="7" filter="url(#glow)" opacity="0">
    ✦  H E L L O   U N I V E R S E  ✦
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="0.3s"/>
  </text>

  <!-- Name -->
  <text x="450" y="168" text-anchor="middle"
    font-family="Courier New, monospace" font-size="50" font-weight="bold"
    fill="white" filter="url(#nameGlow)" letter-spacing="2" opacity="0">
    ANUBHAV YADAV
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="0.6s"/>
  </text>

  <!-- Subtitle with color cycle -->
  <text x="450" y="210" text-anchor="middle"
    font-family="Courier New, monospace" font-size="15"
    fill="#E879F9" letter-spacing="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="1s"/>
    <animate attributeName="fill"
      values="#E879F9;#60A5FA;#34D399;#F472B6;#E879F9"
      dur="6s" repeatCount="indefinite" begin="1s"/>
    Full-Stack Developer  ✦  Python Engineer  ✦  Open Source
  </text>

  <!-- Blinking cursor -->
  <text x="787" y="210"
    font-family="Courier New, monospace" font-size="16"
    fill="#E879F9" opacity="0">
    <animate attributeName="opacity" values="0;1"   dur="0.5s" fill="freeze" begin="1.2s"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s"   repeatCount="indefinite" begin="1.5s"/>
    _
  </text>

  <!-- Terminal prompt -->
  <text x="450" y="248" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11.5"
    fill="#4ADE80" letter-spacing="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="1.5s"/>
    anubhav@cosmos:~$ echo "building the future, one commit at a time"
  </text>

  <!-- Divider -->
  <line x1="100" y1="268" x2="800" y2="268" stroke="url(#divGrad)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.7" dur="1s" fill="freeze" begin="1.8s"/>
  </line>

  <!-- Bottom stats -->
  <text x="225" y="295" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11"
    fill="#94A3B8" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="2s"/>
    ⚡ Full-Stack Engineer
  </text>
  <text x="450" y="295" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11"
    fill="#94A3B8" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="2.2s"/>
    🚀 35+ Repositories
  </text>
  <text x="675" y="295" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11"
    fill="#94A3B8" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="2.4s"/>
    🌌 Open to Opportunities
  </text>

  <!-- Corner brackets -->
  <g stroke="#6B21A8" stroke-width="1.2" fill="none" opacity="0.5">
    <polyline points="8,8 8,26 26,26"/>
    <polyline points="874,8 892,8 892,26"/>
    <polyline points="8,294 8,312 26,312"/>
    <polyline points="874,312 892,312 892,294"/>
  </g>
</svg>
