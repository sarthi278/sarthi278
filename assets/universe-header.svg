<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="cosmos" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="40%" stop-color="#06001a"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <!-- Nebula Purple -->
    <radialGradient id="nebula1" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#6B21A8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0"/>
    </radialGradient>
    <!-- Nebula Blue -->
    <radialGradient id="nebula2" cx="75%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <!-- Nebula Pink -->
    <radialGradient id="nebula3" cx="50%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#BE185D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter for text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Star glow filter -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Strong glow for name -->
    <filter id="nameGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="900" height="320" fill="url(#cosmos)"/>

  <!-- Nebula layers -->
  <rect width="900" height="320" fill="url(#nebula1)"/>
  <rect width="900" height="320" fill="url(#nebula2)"/>
  <rect width="900" height="320" fill="url(#nebula3)"/>

  <!-- === STATIC STARS (many sizes) === -->
  <!-- Tiny stars -->
  <g opacity="0.7">
    <circle cx="12" cy="18" r="0.6" fill="white"/><circle cx="45" cy="7" r="0.5" fill="white"/>
    <circle cx="78" cy="30" r="0.7" fill="#E0E8FF"/><circle cx="130" cy="12" r="0.5" fill="white"/>
    <circle cx="167" cy="45" r="0.6" fill="white"/><circle cx="210" cy="8" r="0.5" fill="#E0E8FF"/>
    <circle cx="250" cy="22" r="0.7" fill="white"/><circle cx="310" cy="5" r="0.5" fill="white"/>
    <circle cx="355" cy="40" r="0.6" fill="#E0E8FF"/><circle cx="402" cy="15" r="0.5" fill="white"/>
    <circle cx="455" cy="28" r="0.7" fill="white"/><circle cx="510" cy="6" r="0.5" fill="#E0E8FF"/>
    <circle cx="560" cy="38" r="0.6" fill="white"/><circle cx="612" cy="11" r="0.5" fill="white"/>
    <circle cx="665" cy="42" r="0.7" fill="#E0E8FF"/><circle cx="718" cy="9" r="0.5" fill="white"/>
    <circle cx="772" cy="33" r="0.6" fill="white"/><circle cx="820" cy="14" r="0.5" fill="#E0E8FF"/>
    <circle cx="870" cy="27" r="0.7" fill="white"/><circle cx="895" cy="8" r="0.5" fill="white"/>
    <circle cx="25" cy="90" r="0.5" fill="white"/><circle cx="68" cy="75" r="0.6" fill="#E0E8FF"/>
    <circle cx="115" cy="98" r="0.5" fill="white"/><circle cx="155" cy="80" r="0.7" fill="white"/>
    <circle cx="192" cy="105" r="0.5" fill="#E0E8FF"/><circle cx="235" cy="72" r="0.6" fill="white"/>
    <circle cx="288" cy="88" r="0.5" fill="white"/><circle cx="332" cy="110" r="0.7" fill="#E0E8FF"/>
    <circle cx="378" cy="78" r="0.5" fill="white"/><circle cx="420" cy="95" r="0.6" fill="white"/>
    <circle cx="468" cy="65" r="0.5" fill="#E0E8FF"/><circle cx="525" cy="100" r="0.7" fill="white"/>
    <circle cx="575" cy="82" r="0.5" fill="white"/><circle cx="628" cy="68" r="0.6" fill="#E0E8FF"/>
    <circle cx="680" cy="92" r="0.5" fill="white"/><circle cx="735" cy="77" r="0.7" fill="white"/>
    <circle cx="788" cy="102" r="0.5" fill="#E0E8FF"/><circle cx="840" cy="85" r="0.6" fill="white"/>
    <circle cx="888" cy="70" r="0.5" fill="white"/>
    <circle cx="30" cy="150" r="0.6" fill="white"/><circle cx="80" cy="135" r="0.5" fill="#E0E8FF"/>
    <circle cx="140" cy="162" r="0.7" fill="white"/><circle cx="195" cy="145" r="0.5" fill="white"/>
    <circle cx="245" cy="168" r="0.6" fill="#E0E8FF"/><circle cx="295" cy="130" r="0.5" fill="white"/>
    <circle cx="348" cy="155" r="0.7" fill="white"/><circle cx="395" cy="140" r="0.5" fill="#E0E8FF"/>
    <circle cx="445" cy="170" r="0.6" fill="white"/><circle cx="495" cy="132" r="0.5" fill="white"/>
    <circle cx="548" cy="158" r="0.7" fill="#E0E8FF"/><circle cx="598" cy="143" r="0.5" fill="white"/>
    <circle cx="648" cy="165" r="0.6" fill="white"/><circle cx="700" cy="138" r="0.5" fill="#E0E8FF"/>
    <circle cx="752" cy="155" r="0.7" fill="white"/><circle cx="805" cy="130" r="0.5" fill="white"/>
    <circle cx="855" cy="160" r="0.6" fill="#E0E8FF"/><circle cx="893" cy="145" r="0.5" fill="white"/>
    <circle cx="20" cy="220" r="0.5" fill="white"/><circle cx="65" cy="205" r="0.7" fill="#E0E8FF"/>
    <circle cx="118" cy="232" r="0.6" fill="white"/><circle cx="168" cy="215" r="0.5" fill="white"/>
    <circle cx="225" cy="240" r="0.7" fill="#E0E8FF"/><circle cx="275" cy="208" r="0.5" fill="white"/>
    <circle cx="325" cy="228" r="0.6" fill="white"/><circle cx="375" cy="212" r="0.5" fill="#E0E8FF"/>
    <circle cx="428" cy="235" r="0.7" fill="white"/><circle cx="478" cy="218" r="0.5" fill="white"/>
    <circle cx="528" cy="242" r="0.6" fill="#E0E8FF"/><circle cx="582" cy="210" r="0.5" fill="white"/>
    <circle cx="635" cy="230" r="0.7" fill="white"/><circle cx="688" cy="215" r="0.5" fill="#E0E8FF"/>
    <circle cx="740" cy="238" r="0.6" fill="white"/><circle cx="792" cy="205" r="0.5" fill="white"/>
    <circle cx="845" cy="225" r="0.7" fill="#E0E8FF"/><circle cx="890" cy="212" r="0.5" fill="white"/>
    <circle cx="38" cy="285" r="0.6" fill="white"/><circle cx="92" cy="270" r="0.5" fill="#E0E8FF"/>
    <circle cx="148" cy="295" r="0.7" fill="white"/><circle cx="202" cy="278" r="0.5" fill="white"/>
    <circle cx="258" cy="308" r="0.6" fill="#E0E8FF"/><circle cx="312" cy="275" r="0.5" fill="white"/>
    <circle cx="365" cy="292" r="0.7" fill="white"/><circle cx="418" cy="280" r="0.5" fill="#E0E8FF"/>
    <circle cx="472" cy="305" r="0.6" fill="white"/><circle cx="525" cy="272" r="0.5" fill="white"/>
    <circle cx="578" cy="298" r="0.7" fill="#E0E8FF"/><circle cx="632" cy="285" r="0.5" fill="white"/>
    <circle cx="685" cy="310" r="0.6" fill="white"/><circle cx="738" cy="275" r="0.5" fill="#E0E8FF"/>
    <circle cx="790" cy="295" r="0.7" fill="white"/><circle cx="842" cy="280" r="0.5" fill="white"/>
    <circle cx="878" cy="302" r="0.6" fill="#E0E8FF"/>
  </g>

  <!-- Medium glowing stars -->
  <g filter="url(#starGlow)">
    <circle cx="55" cy="55" r="1.5" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="25" r="1.8" fill="#C8D6FF" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="58" r="1.6" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="30" r="2" fill="#FFE8C8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="55" r="1.5" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="102" cy="175" r="1.7" fill="#C8D6FF" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="488" cy="185" r="1.6" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="742" cy="175" r="1.8" fill="#FFD6F0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="260" r="1.5" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="665" cy="255" r="2" fill="#C8D6FF" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="265" r="1.7" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Large bright stars with cross sparkle -->
  <g filter="url(#starGlow)">
    <!-- Star at top-left -->
    <circle cx="90" cy="40" r="2.5" fill="white" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.5;0.95" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="90" y1="34" x2="90" y2="46" stroke="white" stroke-width="0.8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="84" y1="40" x2="96" y2="40" stroke="white" stroke-width="0.8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Star at right -->
    <circle cx="830" cy="130" r="2.8" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <line x1="830" y1="123" x2="830" y2="137" stroke="#FFE8A0" stroke-width="0.8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="823" y1="130" x2="837" y2="130" stroke="#FFE8A0" stroke-width="0.8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
    </line>
    <!-- Star bottom area -->
    <circle cx="430" cy="290" r="2.2" fill="#D0C8FF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <line x1="430" y1="284" x2="430" y2="296" stroke="#D0C8FF" stroke-width="0.8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="424" y1="290" x2="436" y2="290" stroke="#D0C8FF" stroke-width="0.8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- === SHOOTING STARS === -->
  <!-- Shooting star 1 -->
  <g>
    <line x1="0" y1="60" x2="120" y2="90" stroke="url(#shoot1)" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0" dur="6s" repeatCount="indefinite" begin="0s"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;800,180" dur="6s" repeatCount="indefinite" begin="0s"/>
    </line>
    <defs>
      <linearGradient id="shoot1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="white" stop-opacity="0"/>
        <stop offset="100%" stop-color="white" stop-opacity="1"/>
      </linearGradient>
    </defs>
  </g>
  <!-- Shooting star 2 -->
  <g>
    <line x1="0" y1="20" x2="80" y2="45" stroke="white" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.8;0" dur="8s" repeatCount="indefinite" begin="2.5s"/>
      <animateTransform attributeName="transform" type="translate" values="200,-10;900,160" dur="8s" repeatCount="indefinite" begin="2.5s"/>
    </line>
  </g>
  <!-- Shooting star 3 -->
  <g>
    <line x1="0" y1="10" x2="90" y2="30" stroke="#C8D6FF" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.7;0" dur="10s" repeatCount="indefinite" begin="5s"/>
      <animateTransform attributeName="transform" type="translate" values="100,-5;850,220" dur="10s" repeatCount="indefinite" begin="5s"/>
    </line>
  </g>

  <!-- === ORBITING PLANET === -->
  <g transform="translate(820, 80)">
    <!-- Planet body -->
    <circle cx="0" cy="0" r="22" fill="#1a0533" stroke="#6B21A8" stroke-width="1.5"/>
    <circle cx="-5" cy="-5" r="8" fill="#2d0d52" opacity="0.6"/>
    <!-- Planet ring -->
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Orbiting moon -->
    <circle cx="0" cy="-40" r="5" fill="#4C1D95">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Planet glow -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#6B21A8" stroke-width="3" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- === SMALL FLOATING ROCKET === -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate"
      values="40,250; 50,240; 40,250" dur="4s" repeatCount="indefinite"/>
    <!-- Rocket body -->
    <ellipse cx="40" cy="250" rx="6" ry="12" fill="#6B21A8"/>
    <!-- Rocket tip -->
    <polygon points="40,235 34,248 46,248" fill="#A78BFA"/>
    <!-- Rocket window -->
    <circle cx="40" cy="250" r="3" fill="#1D4ED8" opacity="0.8"/>
    <!-- Rocket flame -->
    <ellipse cx="40" cy="264" rx="3.5" ry="6" fill="#F97316" opacity="0.9">
      <animate attributeName="ry" values="6;10;6" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="40" cy="265" rx="2" ry="4" fill="#FCD34D" opacity="0.8">
      <animate attributeName="ry" values="4;7;4" dur="0.3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- === MAIN TEXT === -->
  <!-- Greeting -->
  <text x="450" y="98" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="14" fill="#A78BFA" letter-spacing="6" filter="url(#glow)" opacity="0">
    H E L L O &nbsp; U N I V E R S E
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="0.3s"/>
  </text>

  <!-- Name - with cosmic glow -->
  <text x="450" y="168" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="52" font-weight="bold" fill="white" filter="url(#nameGlow)" opacity="0"
    letter-spacing="2">
    ANUBHAV YADAV
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="0.6s"/>
  </text>

  <!-- Animated typing subtitle -->
  <text x="450" y="210" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="16" fill="#E879F9" letter-spacing="2" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="1s"/>
    <animate attributeName="fill" values="#E879F9;#60A5FA;#34D399;#F472B6;#E879F9"
      dur="6s" repeatCount="indefinite" begin="1s"/>
    Full-Stack Developer  ✦  Python Engineer  ✦  Open Source
  </text>

  <!-- Blinking cursor -->
  <text x="785" y="210" font-family="'Courier New', monospace" font-size="16" fill="#E879F9" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1.2s"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="1.5s"/>
    _
  </text>

  <!-- Terminal prompt line -->
  <text x="450" y="248" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="12" fill="#4ADE80" letter-spacing="1" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="1.5s"/>
    anubhav@cosmos:~$ whoami &amp;&amp; echo "building the future, one commit at a time"
  </text>

  <!-- Divider line with glow -->
  <line x1="100" y1="268" x2="800" y2="268" stroke="url(#divGrad)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.7" dur="1s" fill="freeze" begin="1.8s"/>
  </line>
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B21A8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Stats row -->
  <text x="225" y="295" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="11" fill="#94A3B8" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="2s"/>
    ⚡ Full-Stack Engineer
  </text>
  <text x="450" y="295" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="11" fill="#94A3B8" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="2.2s"/>
    🚀 35+ Repositories
  </text>
  <text x="675" y="295" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="11" fill="#94A3B8" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1s" fill="freeze" begin="2.4s"/>
    🌌 Open to Opportunities
  </text>

  <!-- Corner decorations -->
  <g opacity="0.4" stroke="#6B21A8" stroke-width="1" fill="none">
    <polyline points="8,8 8,28 28,28"/>
    <polyline points="872,8 892,8 892,28"/>
    <polyline points="8,292 8,312 28,312"/>
    <polyline points="872,292 892,292 892,312"/>
  </g>
</svg>

