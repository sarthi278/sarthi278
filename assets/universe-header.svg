<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <radialGradient id="cosmos" cx="50%" cy="50%" r="80%">
      <stop offset="0%"   stop-color="#0d0221"/>
      <stop offset="45%"  stop-color="#06001a"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="neb1" cx="18%" cy="38%" r="45%">
      <stop offset="0%"   stop-color="#6B21A8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="80%" cy="62%" r="45%">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="50%" cy="88%" r="38%">
      <stop offset="0%"   stop-color="#BE185D" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetFill" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#2d0d52"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </radialGradient>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6B21A8" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#E0C8FF"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background + Nebulae -->
  <rect width="900" height="320" fill="url(#cosmos)"/>
  <rect width="900" height="320" fill="url(#neb1)"/>
  <rect width="900" height="320" fill="url(#neb2)"/>
  <rect width="900" height="320" fill="url(#neb3)"/>

  <!-- ── STATIC STARS ── -->
  <g opacity="0.65">
    <circle cx="12"  cy="18"  r="0.6" fill="#fff"/>
    <circle cx="45"  cy="7"   r="0.5" fill="#fff"/>
    <circle cx="78"  cy="30"  r="0.7" fill="#E0E8FF"/>
    <circle cx="130" cy="12"  r="0.5" fill="#fff"/>
    <circle cx="167" cy="45"  r="0.6" fill="#fff"/>
    <circle cx="210" cy="8"   r="0.5" fill="#E0E8FF"/>
    <circle cx="250" cy="22"  r="0.7" fill="#fff"/>
    <circle cx="310" cy="5"   r="0.5" fill="#fff"/>
    <circle cx="402" cy="15"  r="0.5" fill="#fff"/>
    <circle cx="455" cy="28"  r="0.7" fill="#fff"/>
    <circle cx="510" cy="6"   r="0.5" fill="#E0E8FF"/>
    <circle cx="560" cy="38"  r="0.6" fill="#fff"/>
    <circle cx="665" cy="42"  r="0.7" fill="#E0E8FF"/>
    <circle cx="718" cy="9"   r="0.5" fill="#fff"/>
    <circle cx="772" cy="33"  r="0.6" fill="#fff"/>
    <circle cx="870" cy="27"  r="0.7" fill="#fff"/>
    <circle cx="25"  cy="90"  r="0.5" fill="#fff"/>
    <circle cx="68"  cy="75"  r="0.6" fill="#E0E8FF"/>
    <circle cx="155" cy="80"  r="0.7" fill="#fff"/>
    <circle cx="288" cy="88"  r="0.5" fill="#fff"/>
    <circle cx="378" cy="78"  r="0.5" fill="#fff"/>
    <circle cx="468" cy="65"  r="0.5" fill="#E0E8FF"/>
    <circle cx="525" cy="100" r="0.7" fill="#fff"/>
    <circle cx="628" cy="68"  r="0.6" fill="#E0E8FF"/>
    <circle cx="735" cy="77"  r="0.7" fill="#fff"/>
    <circle cx="840" cy="85"  r="0.6" fill="#fff"/>
    <circle cx="30"  cy="150" r="0.6" fill="#fff"/>
    <circle cx="140" cy="162" r="0.7" fill="#fff"/>
    <circle cx="245" cy="168" r="0.6" fill="#E0E8FF"/>
    <circle cx="348" cy="155" r="0.7" fill="#fff"/>
    <circle cx="445" cy="170" r="0.6" fill="#fff"/>
    <circle cx="548" cy="158" r="0.7" fill="#E0E8FF"/>
    <circle cx="648" cy="165" r="0.6" fill="#fff"/>
    <circle cx="752" cy="155" r="0.7" fill="#fff"/>
    <circle cx="855" cy="160" r="0.6" fill="#E0E8FF"/>
    <circle cx="65"  cy="205" r="0.7" fill="#E0E8FF"/>
    <circle cx="225" cy="240" r="0.7" fill="#E0E8FF"/>
    <circle cx="428" cy="235" r="0.7" fill="#fff"/>
    <circle cx="582" cy="210" r="0.5" fill="#fff"/>
    <circle cx="740" cy="238" r="0.6" fill="#fff"/>
    <circle cx="845" cy="225" r="0.7" fill="#E0E8FF"/>
    <circle cx="38"  cy="285" r="0.6" fill="#fff"/>
    <circle cx="148" cy="295" r="0.7" fill="#fff"/>
    <circle cx="312" cy="275" r="0.5" fill="#fff"/>
    <circle cx="472" cy="305" r="0.6" fill="#fff"/>
    <circle cx="578" cy="298" r="0.7" fill="#E0E8FF"/>
    <circle cx="790" cy="295" r="0.7" fill="#fff"/>
    <circle cx="878" cy="302" r="0.6" fill="#E0E8FF"/>
  </g>

  <!-- ── TWINKLING STARS (no begin/freeze) ── -->
  <g filter="url(#starBlur)">
    <circle cx="55"  cy="55"  r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="25"  r="1.8" fill="#C8D6FF">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="58"  r="1.6" fill="#fff">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="30"  r="2"   fill="#FFE8C8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="102" cy="175" r="1.7" fill="#C8D6FF">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="488" cy="185" r="1.6" fill="#fff">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="742" cy="175" r="1.8" fill="#FFD6F0">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="260" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="665" cy="255" r="2"   fill="#C8D6FF">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="265" r="1.7" fill="#fff">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── SPARKLE STARS ── -->
  <circle cx="90" cy="40" r="2.5" fill="#fff" filter="url(#starBlur)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="290" r="2.2" fill="#D0C8FF" filter="url(#starBlur)">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="195" r="2" fill="#FFE8A0" filter="url(#starBlur)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ── SHOOTING STAR 1 (opacity flash only, no translate on rect) ── -->
  <line x1="50" y1="52" x2="180" y2="72" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x1"     values="50;750"      dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y1"     values="52;182"      dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2"     values="180;880"     dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2"     values="72;202"      dur="6s" repeatCount="indefinite"/>
  </line>
  <!-- ── SHOOTING STAR 2 ── -->
  <line x1="200" y1="20" x2="310" y2="45" stroke="#C8D6FF" stroke-width="1.2" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.7;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x1"     values="200;700"     dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y1"     values="20;130"      dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2"     values="310;810"     dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y2"     values="45;155"      dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- ── PLANET (top-right) ── -->
  <g transform="translate(818,80)">
    <circle cx="0" cy="0" r="23" fill="url(#planetFill)" stroke="#6B21A8" stroke-width="1.5"/>
    <circle cx="-6" cy="-7" r="8" fill="#200840" opacity="0.55"/>
    <!-- Pulsing glow -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Orbital ring -->
    <ellipse cx="0" cy="0" rx="37" ry="11" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Moon on orbit -->
    <circle cx="37" cy="0" r="5" fill="#4C1D95">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── ROCKET (left, floating) ── -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4s" repeatCount="indefinite"/>
    <!-- Body -->
    <ellipse cx="58" cy="248" rx="7" ry="14" fill="#6B21A8"/>
    <!-- Nose -->
    <polygon points="58,230 50,246 66,246" fill="#A78BFA"/>
    <!-- Window -->
    <circle cx="58" cy="249" r="3.5" fill="#1D4ED8"/>
    <circle cx="58" cy="249" r="2"   fill="#60A5FA" opacity="0.7"/>
    <!-- Fins -->
    <polygon points="51,258 45,271 54,264" fill="#7C3AED"/>
    <polygon points="65,258 71,271 62,264" fill="#7C3AED"/>
    <!-- Flame -->
    <ellipse cx="58" cy="268" rx="4.5" ry="7" fill="#F97316">
      <animate attributeName="ry"      values="7;13;7"       dur="0.22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.5;0.95" dur="0.22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="58" cy="269" rx="2.5" ry="5" fill="#FCD34D">
      <animate attributeName="ry" values="5;9;5" dur="0.22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ── GREETING ── -->
  <text x="450" y="98" text-anchor="middle"
    font-family="Courier New, monospace" font-size="12.5"
    fill="#A78BFA" letter-spacing="6" filter="url(#softGlow)">
    ✦  H E L L O   U N I V E R S E  ✦
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- ── NAME ── -->
  <text x="450" y="168" text-anchor="middle"
    font-family="Courier New, monospace" font-size="50" font-weight="bold"
    fill="url(#nameGrad)" filter="url(#softGlow)" letter-spacing="2">
    ANUBHAV YADAV
  </text>

  <!-- ── SUBTITLE with color cycle ── -->
  <text x="450" y="210" text-anchor="middle"
    font-family="Courier New, monospace" font-size="14.5" letter-spacing="2">
    <animate attributeName="fill"
      values="#E879F9;#60A5FA;#34D399;#F472B6;#E879F9"
      dur="6s" repeatCount="indefinite"/>
    Full-Stack Developer  ✦  Python Engineer  ✦  Open Source
  </text>

  <!-- ── TERMINAL LINE ── -->
  <text x="450" y="248" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11.5"
    fill="#4ADE80" letter-spacing="0.5" opacity="0.85">
    anubhav@cosmos:~$ echo "building the future, one commit at a time"
  </text>
  <!-- Blinking cursor -->
  <text x="789" y="248" font-family="Courier New, monospace" font-size="12" fill="#4ADE80">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    |
  </text>

  <!-- ── DIVIDER ── -->
  <line x1="100" y1="264" x2="800" y2="264" stroke="url(#divLine)" stroke-width="1" opacity="0.7"/>

  <!-- ── BOTTOM STATS ── -->
  <text x="225" y="291" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11" fill="#94A3B8">
    ⚡ Full-Stack Engineer
  </text>
  <text x="450" y="291" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11" fill="#94A3B8">
    🚀 35+ Repositories
  </text>
  <text x="675" y="291" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11" fill="#94A3B8">
    🌌 Open to Opportunities
  </text>

  <!-- ── CORNER BRACKETS ── -->
  <g stroke="#6B21A8" stroke-width="1.2" fill="none" opacity="0.5">
    <polyline points="8,8 8,26 26,26"/>
    <polyline points="874,8 892,8 892,26"/>
    <polyline points="8,294 8,312 26,312"/>
    <polyline points="874,312 892,312 892,294"/>
  </g>
</svg>
