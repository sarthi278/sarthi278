<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="prj-t">
  <title id="prj-t">Selected Work - Projects</title>
  <defs>
    <linearGradient id="prj-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <clipPath id="prj-clip"><rect width="1200" height="360" rx="14"/></clipPath>
  </defs>
  <style>
    .prj-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .prj-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>
  <g clip-path="url(#prj-clip)">
    <rect width="1200" height="360" fill="url(#prj-bg)"/>

    <!-- Project 1: Portfolio 2.0 Web Platform -->
    <g transform="translate(40, 20)">
      <rect width="540" height="320" rx="12" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="28" y="38" class="prj-mono" font-size="10.5" fill="#C77B9B" letter-spacing="2">01 // PRODUCTION WEB APPLICATION</text>
      <text x="28" y="72" class="prj-serif" font-size="28" font-weight="700" fill="#F8F0F3">Portfolio 2.0 Platform</text>
      <text x="28" y="104" class="prj-mono" font-size="12" fill="#E5B5C7">
        Ultra-fast interactive personal platform with Next.js 14 &amp; Tailwind.
      </text>
      
      <!-- Tech Stack Badges -->
      <g transform="translate(28, 128)">
        <rect width="70" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="35" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">Next.js 14</text>

        <rect x="80" width="85" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="122" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">TypeScript</text>

        <rect x="175" width="85" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="217" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">TailwindCSS</text>

        <rect x="270" width="60" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="300" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">Vercel</text>
      </g>

      <line x1="28" y1="172" x2="512" y2="172" stroke="#701A3D" stroke-width="1"/>

      <!-- Metrics Breakdown -->
      <g transform="translate(28, 202)">
        <text class="prj-mono" font-size="10" fill="#C77B9B">PERFORMANCE</text>
        <text y="24" class="prj-serif" font-size="22" font-weight="700" fill="#F8F0F3">100/100</text>
        <text y="42" class="prj-mono" font-size="9" fill="#E5B5C7">Lighthouse Score</text>

        <g transform="translate(160, 0)">
          <text class="prj-mono" font-size="10" fill="#C77B9B">RENDER TIME</text>
          <text y="24" class="prj-serif" font-size="22" font-weight="700" fill="#F8F0F3">&lt;80ms</text>
          <text y="42" class="prj-mono" font-size="9" fill="#E5B5C7">Edge SSR Latency</text>
        </g>

        <g transform="translate(320, 0)">
          <text class="prj-mono" font-size="10" fill="#C77B9B">STATUS</text>
          <text y="24" class="prj-serif" font-size="22" font-weight="700" fill="#00ff66">LIVE</text>
          <text y="42" class="prj-mono" font-size="9" fill="#E5B5C7">Production Deploy</text>
        </g>
      </g>

      <text x="28" y="292" class="prj-mono" font-size="11" fill="#C77B9B">&gt; URL: portfolio2-o-eight.vercel.app</text>
    </g>

    <!-- Project 2: High-Concurrency Backend Service -->
    <g transform="translate(620, 20)">
      <rect width="540" height="320" rx="12" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="28" y="38" class="prj-mono" font-size="10.5" fill="#C77B9B" letter-spacing="2">02 // MICROSERVICES ARCHITECTURE</text>
      <text x="28" y="72" class="prj-serif" font-size="28" font-weight="700" fill="#F8F0F3">Resilient API Core</text>
      <text x="28" y="104" class="prj-mono" font-size="12" fill="#E5B5C7">
        Scalable REST and GraphQL backend services with Redis pub/sub.
      </text>
      
      <!-- Tech Stack Badges -->
      <g transform="translate(28, 128)">
        <rect width="65" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="32" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">Node.js</text>

        <rect x="75" width="65" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="107" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">Python</text>

        <rect x="150" width="85" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="192" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">PostgreSQL</text>

        <rect x="245" width="60" height="22" rx="4" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="275" y="15" text-anchor="middle" class="prj-mono" font-size="10" fill="#F8F0F3">Redis</text>
      </g>

      <line x1="28" y1="172" x2="512" y2="172" stroke="#701A3D" stroke-width="1"/>

      <!-- Metrics Breakdown -->
      <g transform="translate(28, 202)">
        <text class="prj-mono" font-size="10" fill="#C77B9B">THROUGHPUT</text>
        <text y="24" class="prj-serif" font-size="22" font-weight="700" fill="#F8F0F3">5k+ req/s</text>
        <text y="42" class="prj-mono" font-size="9" fill="#E5B5C7">Stress-tested load</text>

        <g transform="translate(160, 0)">
          <text class="prj-mono" font-size="10" fill="#C77B9B">AVAILABILITY</text>
          <text y="24" class="prj-serif" font-size="22" font-weight="700" fill="#F8F0F3">99.8%</text>
          <text y="42" class="prj-mono" font-size="9" fill="#E5B5C7">Zero downtime</text>
        </g>

        <g transform="translate(320, 0)">
          <text class="prj-mono" font-size="10" fill="#C77B9B">SECURITY</text>
          <text y="24" class="prj-serif" font-size="22" font-weight="700" fill="#00f3ff">JWT + RBAC</text>
          <text y="42" class="prj-mono" font-size="9" fill="#E5B5C7">Rate-limited</text>
        </g>
      </g>

      <text x="28" y="292" class="prj-mono" font-size="11" fill="#C77B9B">&gt; GITHUB: github.com/sarthi278</text>
    </g>
  </g>
</svg>
