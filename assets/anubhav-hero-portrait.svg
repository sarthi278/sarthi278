<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Anubhav Yadav — Full-Stack Software Engineer &amp; Solutions Architect</title>
  <desc id="hero-desc">Engineering high-concurrency systems. Designing seamless interfaces. Full-Stack Developer &amp; Creative Technologist.</desc>

  <defs>
    <!-- Rich Luminous Background Gradient -->
    <radialGradient id="hero-bg" cx="70%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#47142E"/>
      <stop offset="40%" stop-color="#2D0D1D"/>
      <stop offset="75%" stop-color="#1A0711"/>
      <stop offset="100%" stop-color="#12040B"/>
    </radialGradient>

    <!-- Intense Radiant Ambient Glow Orbs -->
    <radialGradient id="hero-light-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1775" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#B81452" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-light-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF66A3" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9E1B50" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FF85B2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF1775" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Text & Sheen Gradients -->
    <linearGradient id="hero-name-grad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="650" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFD1E3"/>
      <stop offset="100%" stop-color="#FFA3C7"/>
    </linearGradient>

    <linearGradient id="hero-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="-20" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1100 0;1100 0" keyTimes="0;.35;1" dur="6s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border-light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF66A3"/>
      <stop offset="25%" stop-color="#FF1775"/>
      <stop offset="50%" stop-color="#FFA8CC"/>
      <stop offset="75%" stop-color="#FF1775"/>
      <stop offset="100%" stop-color="#FF66A3"/>
    </linearGradient>

    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF85B2" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#FF1775"/>
      <stop offset="85%" stop-color="#701A3D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF66A3" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <clipPath id="hero-arch"><path d="M847 380 V202 A118 118 0 0 1 1083 202 V380 Z"/></clipPath>
    <clipPath id="hero-clip"><rect width="1200" height="480" rx="20"/></clipPath>
  </defs>

  <style>
    .hero-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .hero-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }

    @keyframes cornerPulse {
      0%, 100% { stroke-opacity: 0.6; stroke: #FF66A3; filter: drop-shadow(0 0 6px #FF1775); }
      50% { stroke-opacity: 1; stroke: #FFFFFF; filter: drop-shadow(0 0 16px #FF1775) drop-shadow(0 0 25px #FF85B2); }
    }
    @keyframes flareBlink {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    @keyframes borderFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 3360; }
    }
    @keyframes ambientBreath {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.8; }
      50% { transform: scale(1.15) translate(-30px, 15px); opacity: 1; }
    }

    .corner-bracket {
      animation: cornerPulse 3s ease-in-out infinite;
    }
    .corner-flare-dot {
      animation: flareBlink 2.5s ease-in-out infinite;
    }
    .glowing-frame {
      stroke-dasharray: 400 120 200 80;
      animation: borderFlow 18s linear infinite;
    }
    .ambient-light {
      animation: ambientBreath 8s ease-in-out infinite;
      transform-origin: 940px 180px;
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <!-- Illuminated Canvas Base -->
    <rect width="1200" height="480" fill="url(#hero-bg)"/>

    <!-- Radiant Ambient Light Flares -->
    <ellipse cx="940" cy="170" rx="460" ry="320" fill="url(#hero-light-a)" class="ambient-light"/>
    <ellipse cx="160" cy="420" rx="380" ry="240" fill="url(#hero-light-b)"/>
    <ellipse cx="600" cy="50" rx="300" ry="100" fill="url(#hero-light-b)" opacity="0.4"/>

    <!-- Bright Grid Pattern -->
    <rect width="1200" height="480" fill="url(#hero-grid)"/>

    <!-- Luminous Outer Frame Border with Laser Beam -->
    <rect x="3" y="3" width="1194" height="474" rx="18" fill="none" stroke="url(#border-light-beam)" stroke-width="2.5" class="glowing-frame" filter="url(#neon-glow)"/>

    <!-- Drifting Glowing Stardust Particles -->
    <g fill="#FFFFFF" filter="url(#neon-glow)">
      <circle cx="560" cy="120" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="3.8s" repeatCount="indefinite"/><animate attributeName="cy" values="120;90" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="70" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="4.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="70;44" dur="4.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="380" r="2"><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="380;348" dur="4.2s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="420" r="2.4"><animate attributeName="opacity" values="0;1;0" dur="5s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" values="420;390" dur="5s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="180" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="4.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Orbital System around Monogram -->
    <g transform="translate(965 240)">
      <circle r="215" fill="none" stroke="#FF66A3" stroke-opacity=".25" stroke-dasharray="2 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="120s" repeatCount="indefinite"/>
      </circle>
      <circle r="185" fill="none" stroke="#FFA3C7" stroke-width="1.8" stroke-opacity=".8" filter="url(#neon-glow)"/>
      <circle r="155" fill="none" stroke="#FF1775" stroke-opacity=".4" stroke-dasharray="4 8"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="75s" repeatCount="indefinite"/>
        <circle cx="0" cy="185" r="4.5" fill="#FFFFFF" filter="url(#neon-glow)"/>
        <circle cx="-155" cy="0" r="3.5" fill="#FF85B2"/>
      </g>
    </g>

    <!-- Glowing Luxury Arch Portrait & Monogram Block -->
    <g>
      <path d="M835 392 V202 A130 130 0 0 1 1095 202 V392 Z" fill="none" stroke="#FF66A3" stroke-width="2" stroke-opacity=".6" filter="url(#neon-glow)">
        <animate attributeName="stroke-opacity" values=".4;.95;.4" dur="4s" repeatCount="indefinite"/>
      </path>
      <g clip-path="url(#hero-arch)">
        <rect x="847" y="84" width="236" height="296" fill="#300F21"/>
        <circle cx="965" cy="220" r="95" fill="#FF1775" opacity=".55" filter="url(#neon-glow)"/>
        
        <circle cx="965" cy="235" r="62" fill="none" stroke="#FFA3C7" stroke-width="2" stroke-dasharray="10 4"/>
        <text x="965" y="256" text-anchor="middle" class="hero-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="2" filter="url(#neon-glow)">AY</text>
        
        <text x="965" y="340" text-anchor="middle" class="hero-mono" font-size="10.5" font-weight="700" fill="#FFD1E3" letter-spacing="3">28.6139° N / 77.2090° E</text>
      </g>
    </g>

    <!-- Clean Absolute Content Layout -->
    <!-- 1. Top Technical Category -->
    <text x="60" y="68" class="hero-mono" font-size="11.5" font-weight="700" fill="#FFA3C7" letter-spacing="3">
      01 // ENGINEERING &#8226; ARCHITECTURE &#8226; CREATIVE TECHNOLOGIES
    </text>
    <line x1="60" y1="84" x2="720" y2="84" stroke="url(#hero-rule)" stroke-width="1.8"/>

    <!-- 2. Main Name Heading with Brilliant Sheen & Drop-Shadow -->
    <text x="60" y="165" class="hero-serif" font-size="70" font-weight="700" fill="url(#hero-name-grad)" letter-spacing="-.5" filter="url(#neon-glow)">
      Anubhav
    </text>
    <text x="60" y="242" class="hero-serif" font-size="70" font-weight="700" fill="url(#hero-name-grad)" letter-spacing="-.5" filter="url(#neon-glow)">
      Yadav.
    </text>
    <!-- Sliding Light Sheen -->
    <text x="60" y="242" class="hero-serif" font-size="70" font-weight="700" fill="url(#hero-sheen)" letter-spacing="-.5">
      Yadav.
    </text>

    <!-- 3. Subtitle Role & Description -->
    <text x="60" y="294" class="hero-mono" font-size="12.5" font-weight="700" fill="#FFB2D1" letter-spacing="2.5">
      FULL-STACK SOFTWARE ENGINEER &amp; CLOUD ARCHITECT
    </text>
    <text x="60" y="328" class="hero-serif" font-style="italic" font-size="18" fill="#FFFFFF" letter-spacing=".5">
      Engineering high-concurrency systems. Designing seamless user experiences.
    </text>

    <!-- 4. Bottom Rule & Telemetry -->
    <line x1="60" y1="365" x2="720" y2="365" stroke="url(#hero-rule)" stroke-width="1.8"/>
    <text x="60" y="392" class="hero-mono" font-size="11.5" font-weight="600" fill="#FFB2D1" letter-spacing="2">
      BASE // INDIA (UTC+5:30) &#8226; CORE // TYPESCRIPT &#8226; PYTHON &#8226; NEXT.JS &#8226; NODE.JS
    </text>

    <!-- Highly Illuminated Animated Corner Accents & Brackets -->
    <!-- Top-Left Corner -->
    <path d="M 18 60 L 18 18 L 60 18" fill="none" stroke="#FFA3C7" stroke-width="3" class="corner-bracket"/>
    <circle cx="18" cy="18" r="5" fill="url(#corner-flare)" class="corner-flare-dot"/>

    <!-- Top-Right Corner -->
    <path d="M 1182 60 L 1182 18 L 1140 18" fill="none" stroke="#FFA3C7" stroke-width="3" class="corner-bracket"/>
    <circle cx="1182" cy="18" r="5" fill="url(#corner-flare)" class="corner-flare-dot"/>

    <!-- Bottom-Left Corner -->
    <path d="M 18 420 L 18 462 L 60 462" fill="none" stroke="#FFA3C7" stroke-width="3" class="corner-bracket"/>
    <circle cx="18" cy="462" r="5" fill="url(#corner-flare)" class="corner-flare-dot"/>

    <!-- Bottom-Right Corner -->
    <path d="M 1182 420 L 1182 462 L 1140 462" fill="none" stroke="#FFA3C7" stroke-width="3" class="corner-bracket"/>
    <circle cx="1182" cy="462" r="5" fill="url(#corner-flare)" class="corner-flare-dot"/>
  </g>
</svg>
