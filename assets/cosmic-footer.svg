<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0d0221"/><stop offset="100%" stop-color="#030010"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B21A8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="100" fill="url(#bg)"/>

  <!-- Stars -->
  <g opacity="0.5">
    <circle cx="50" cy="20" r="0.8" fill="white"/><circle cx="200" cy="10" r="0.6" fill="#C8D6FF"/>
    <circle cx="380" cy="22" r="0.7" fill="white"/><circle cx="520" cy="8" r="0.5" fill="white"/>
    <circle cx="680" cy="18" r="0.8" fill="#C8D6FF"/><circle cx="830" cy="12" r="0.6" fill="white"/>
    <circle cx="100" cy="80" r="0.6" fill="white"/><circle cx="310" cy="88" r="0.7" fill="#C8D6FF"/>
    <circle cx="460" cy="82" r="0.5" fill="white"/><circle cx="650" cy="90" r="0.8" fill="white"/>
    <circle cx="800" cy="85" r="0.6" fill="#C8D6FF"/>
  </g>

  <!-- Top line -->
  <line x1="0" y1="2" x2="900" y2="2" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Rocket icon -->
  <text x="30" y="62" font-size="28" filter="url(#glow)">🚀</text>

  <!-- Main footer text -->
  <text x="450" y="45" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="16" font-weight="bold" fill="white" filter="url(#glow)" letter-spacing="2">
    Anubhav Yadav
  </text>
  <text x="450" y="65" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="11" letter-spacing="1">
    <tspan fill="#A78BFA">Building systems that outlast the hype.</tspan>
  </text>

  <!-- Animated color wave text -->
  <text x="450" y="85" text-anchor="middle" font-family="'Courier New', monospace"
    font-size="10" fill="#6B21A8" letter-spacing="3">
    <animate attributeName="fill" values="#6B21A8;#EC4899;#3B82F6;#22C55E;#6B21A8" dur="6s" repeatCount="indefinite"/>
    ✦ sarthi278 · portfolio2-o-eight.vercel.app · linkedin.com/in/anubhav-yadav-it27 ✦
  </text>

  <!-- Star icon -->
  <text x="862" y="62" font-size="28" filter="url(#glow)">⭐</text>

  <!-- Bottom line -->
  <line x1="0" y1="98" x2="900" y2="98" stroke="url(#lineGrad)" stroke-width="1"/>
</svg>

