<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Anubhav Yadav</title>
  <desc id="ab-d">Full-Stack Software Engineer and Cloud Architect. Building high-performance web applications and distributed systems.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ab-glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <pattern id="ab-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#F8F0F3" opacity=".025"/></pattern>
    <clipPath id="ab-clip"><rect width="1200" height="420" rx="14"/></clipPath>
  </defs>
  <style>
    .ab-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    @keyframes termBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .term-cursor { animation: termBlink 1s infinite; }
  </style>
  <g clip-path="url(#ab-clip)">
    <rect width="1200" height="420" fill="url(#ab-bg)"/>
    <rect width="1200" height="420" fill="url(#ab-glow)"/>
    <rect width="1200" height="420" fill="url(#ab-scan)"/>

    <!-- Terminal Window Frame -->
    <rect x="40" y="30" width="700" height="360" rx="10" fill="#14080F" stroke="#701A3D" stroke-width="1.5"/>
    <rect x="40" y="30" width="700" height="36" rx="10" fill="#200B17"/>
    
    <!-- Window Controls -->
    <circle cx="65" cy="48" r="6" fill="#701A3D"/>
    <circle cx="85" cy="48" r="6" fill="#A82C58"/>
    <circle cx="105" cy="48" r="6" fill="#C77B9B"/>
    <text x="390" y="52" text-anchor="middle" class="ab-mono" font-size="11" fill="#C77B9B" letter-spacing="1.5">bash — anubhav@workstation: ~</text>

    <!-- Terminal Content Lines -->
    <g transform="translate(65, 100)" class="ab-mono" font-size="13">
      <!-- Line 1 -->
      <text y="0" fill="#E5B5C7" font-weight="700">&gt; whoami</text>
      <text y="24" fill="#F8F0F3">Anubhav Yadav (@sarthi278) &mdash; Full-Stack Software Engineer</text>

      <!-- Line 2 -->
      <text y="62" fill="#E5B5C7" font-weight="700">&gt; cat location.json</text>
      <text y="86" fill="#F8F0F3">&#123; "origin": "India", "timezone": "UTC+05:30", "status": "Building 24/7" &#125;</text>

      <!-- Line 3 -->
      <text y="124" fill="#E5B5C7" font-weight="700">&gt; cat tech_core.txt</text>
      <text y="148" fill="#F8F0F3">TypeScript &bull; React &bull; Next.js 14 &bull; Node.js &bull; Python &bull; PostgreSQL &bull; Docker</text>

      <!-- Line 4 -->
      <text y="186" fill="#E5B5C7" font-weight="700">&gt; cat philosophy.md</text>
      <text y="210" fill="#F8F0F3">"Turn complex backend bottlenecks into frictionless, elegant user interfaces."</text>

      <!-- Active Prompt -->
      <text y="246" fill="#701A3D" font-weight="700">&gt; <tspan fill="#E5B5C7">git status</tspan><tspan fill="#F8F0F3" class="term-cursor"> _</tspan></text>
    </g>

    <!-- Right Highlight Cards -->
    <g transform="translate(770, 30)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="390" height="110" rx="10" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="24" y="34" class="ab-mono" font-size="10.5" fill="#C77B9B" letter-spacing="2">01 // SPECIALTY</text>
      <text x="24" y="62" class="ab-serif" font-size="20" font-weight="700" fill="#F8F0F3">High-Concurrency Web Apps</text>
      <text x="24" y="86" class="ab-mono" font-size="11.5" fill="#E5B5C7">Optimized state, server rendering &amp; edge caching.</text>

      <!-- Card 2 -->
      <rect x="0" y="125" width="390" height="110" rx="10" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="24" y="159" class="ab-mono" font-size="10.5" fill="#C77B9B" letter-spacing="2">02 // BACKEND ARCHITECTURE</text>
      <text x="24" y="187" class="ab-serif" font-size="20" font-weight="700" fill="#F8F0F3">Distributed Microservices</text>
      <text x="24" y="211" class="ab-mono" font-size="11.5" fill="#E5B5C7">Node.js, Express, Python, FastAPI &amp; GraphQL.</text>

      <!-- Card 3 -->
      <rect x="0" y="250" width="390" height="110" rx="10" fill="#14080F" stroke="#701A3D" stroke-width="1.2"/>
      <text x="24" y="284" class="ab-mono" font-size="10.5" fill="#C77B9B" letter-spacing="2">03 // PROBLEM SOLVING</text>
      <text x="24" y="312" class="ab-serif" font-size="20" font-weight="700" fill="#F8F0F3">Algorithmic Precision</text>
      <text x="24" y="336" class="ab-mono" font-size="11.5" fill="#E5B5C7">Competitive coding on LeetCode &amp; HackerRank.</text>
    </g>
  </g>
</svg>
