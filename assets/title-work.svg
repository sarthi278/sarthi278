<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="03 Selected Work: Products, not assignments.">
  <defs>
    <linearGradient id="tw-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#C77B9B"/><stop offset=".6" stop-color="#701A3D"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tw-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#E5B5C7"/><stop offset=".5" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="tw-pulse"><stop offset="0" stop-color="#F8F0F3"/><stop offset=".5" stop-color="#E5B5C7" stop-opacity=".6"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tw-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tw-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>
  <line x1="40" y1="20" x2="1160" y2="20" stroke="url(#tw-line)" stroke-width="1"/>
  <circle cx="40" cy="20" r="3" fill="url(#tw-pulse)"/>
  <text x="40" y="44" class="tw-mono" font-size="11" font-weight="700" fill="#C77B9B" letter-spacing="3.5">03 // SELECTED WORK</text>
  <text x="40" y="96" class="tw-serif" font-size="38" font-weight="600" fill="#F8F0F3" letter-spacing=".5">Products, not assignments.</text>
  <text x="40" y="96" class="tw-serif" font-size="38" font-weight="600" fill="url(#tw-sheen)" letter-spacing=".5">Products, not assignments.</text>
</svg>
